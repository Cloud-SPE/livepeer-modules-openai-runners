# openai-chat-runner sidecar — sits between the capability broker and
# vLLM (or any OpenAI-compatible chat backend). Counts streaming tokens
# from upstream SSE and emits X-Livepeer-Work-Units as an HTTP trailer
# the broker reads via the response-trailer extractor.
#
# Pair with docker-compose.vllm.chat.yml. Both stacks must join the
# same `ingress` network so the runner can resolve `vllm_chat` by name
# and the broker can resolve `openai_chat_runner` by name.

services:
  openai_chat_runner:
    image: ${REGISTRY:-tztcloud}/openai-chat-runner:${TAG:-v2.0.0}
    container_name: openai_chat_runner
    hostname: openai_chat_runner
    environment:
      - RUNNER_ADDR=:8080
      - UPSTREAM_URL=${UPSTREAM_URL:-http://vllm_chat:8000/v1/chat/completions}
      - UPSTREAM_KIND=vllm
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - MODEL_ALLOWLIST=${MODEL_ALLOWLIST:-}
      - OUTPUT_TOKEN_WEIGHT=${OUTPUT_TOKEN_WEIGHT:-}
      - CAPABILITY_NAME=openai:chat-completions
      - USAGE_FIELD=${USAGE_FIELD:-total_tokens}
      - MODEL_DISCOVERY_RETRIES=${MODEL_DISCOVERY_RETRIES:-10}
      # Contract metadata — surfaced at GET /.well-known/livepeer-runner (identity + x-* keys).
      - SERVED_MODEL_NAME=${SERVED_MODEL_NAME:-}
      - BACKEND_MODEL=${BACKEND_MODEL:-}
      - CONTEXT_LENGTH=${CONTEXT_LENGTH:-0}
      - REASONING_PARSER=${REASONING_PARSER:-}
      - TOOL_CALL_PARSER=${TOOL_CALL_PARSER:-}
      - QUANTIZATION=${QUANTIZATION:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: ingress
    external: true
