name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every compose overlay
        run: ./build-images.sh validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go and Python unit tests (in Docker)
        run: ./build-images.sh test

  build:
    runs-on: ubuntu-latest
    needs: [validate-compose, test]
    strategy:
      fail-fast: false
      matrix:
        image:
          - python-base
          - cuda13-python-base
          - openai-audio-runner
          - openai-tts-runner
          - openai-image-generation-runner
          - rerank-runner
          - image-model-downloader
          - rerank-model-downloader
          - openai-chat-runner
          - openai-embeddings-runner
          - openai-tester
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dependent bases first
        if: ${{ !contains(fromJSON('["python-base","cuda13-python-base"]'), matrix.image) }}
        run: |
          # ML and downloader images depend on a base built locally.
          case "${{ matrix.image }}" in
            openai-audio-runner|openai-tts-runner|openai-image-generation-runner|rerank-runner)
              ./build-images.sh build cuda13-python-base ;;
            image-model-downloader|rerank-model-downloader)
              ./build-images.sh build python-base ;;
          esac
      - name: Build ${{ matrix.image }}
        run: ./build-images.sh build ${{ matrix.image }}
