name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every compose overlay
        run: ./infra/scripts/validate-compose.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go and Python unit tests (in Docker)
        run: ./infra/scripts/test.sh

  build:
    runs-on: ubuntu-latest
    needs: [validate-compose, test]
    strategy:
      fail-fast: false
      matrix:
        image:
          - python-base
          - cuda13-python-base
          - openai-audio-runner
          - openai-tts-runner
          - openai-image-generation-runner
          - rerank-runner
          - image-model-downloader
          - rerank-model-downloader
          - openai-chat-runner
          - openai-embeddings-runner
          - openai-tester
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The script adds the base image a runner builds on, so one name is enough.
      - name: Build ${{ matrix.image }}
        run: ./infra/scripts/build-images.sh ${{ matrix.image }}
