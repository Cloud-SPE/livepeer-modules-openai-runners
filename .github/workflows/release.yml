name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0.1)'
        required: true

permissions:
  contents: write

env:
  REGISTRY: tztcloud
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # PUSH=1 builds and pushes in one pass, refuses a dirty tree (the checkout
      # is clean), and appends every pushed digest to infra/build/<TAG>-digests.txt.
      - name: Build and push all images at ${{ env.TAG }}
        env:
          PUSH: "1"
          PLATFORMS: linux/amd64,linux/arm64
        run: ./infra/scripts/build-images.sh

      # Pascal flavor: the default cu128 torch wheels carry sm_75+ kernels
      # only, so a GTX 1080 (sm_61) needs the cu126 wheels. Same Dockerfiles,
      # different wheel index, `-pascal` tag suffix.
      - name: Build and push the CUDA runners at ${{ env.TAG }}-pascal (cu126 wheels)
        env:
          PUSH: "1"
          TAG: ${{ env.TAG }}-pascal
          PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
        run: ./infra/scripts/build-images.sh openai-audio-runner openai-tts-runner openai-image-generation-runner rerank-runner

      - name: Collect digest records
        run: |
          mkdir -p /tmp/digests
          cp infra/build/${{ env.TAG }}-digests.txt infra/build/${{ env.TAG }}-pascal-digests.txt /tmp/digests/
          cat /tmp/digests/*
      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: /tmp/digests/*.txt

  github-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: digests
          path: /tmp/digests
      - name: Release notes from CHANGELOG.md plus the pushed digests
        run: |
          tag="${{ env.TAG }}"
          # Pull the section between the matching heading and the next heading.
          awk -v t="$tag" '
            /^## \[/ {if (found) exit; if ($0 ~ "\\[" t "\\]") found=1; next}
            found {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG entry for $tag; using auto-generated notes." > /tmp/release-notes.md
          fi
          {
            echo
            echo '## Image digests'
            echo
            echo 'Pin these, not the tag. Check the two files in as `infra/build/` with the release.'
            echo
            echo '```'
            cat /tmp/digests/*.txt
            echo '```'
          } >> /tmp/release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: /tmp/release-notes.md
          files: /tmp/digests/*.txt
          draft: false
          prerelease: false
          generate_release_notes: true
